networks:
  inspection-dev:
    driver: bridge

services:
  postgres:
    image: postgres:16.11-trixie
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - inspection-dev
    environment:
      POSTGRES_DB: cmdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  redis:
    image: redis:7.2.12-bookworm
    ports:
      - "6379:6379"
    networks:
      - inspection-dev

  backend:
    image: ghcr.io/bernylinville/inspection-tool/backend:dev
    ports:
      - "8080:8080"
    volumes:
      - ./apps/cmdb-server/configs:/app/configs
    working_dir: /app
    depends_on:
      - postgres
      - redis
    networks:
      - inspection-dev
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379

  frontend:
    image: ghcr.io/bernylinville/inspection-tool/frontend:dev
    ports:
      - "8088:80"
    depends_on:
      - backend
    networks:
      - inspection-dev

volumes:
  postgres-data:
