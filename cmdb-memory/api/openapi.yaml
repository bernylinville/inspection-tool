openapi: 3.1.0
info:
  title: CMDB 资产管理平台 API
  description: |
    CMDB 资产管理平台 RESTful API 文档。

    ## 功能概述
    - **资产管理**: 主机、MySQL、Redis、Nginx、Tomcat、Elasticsearch 等资产的 CRUD
    - **数据聚合**: 透传 VictoriaMetrics 监控数据和 FlashDuty 告警数据（只读）
    - **巡检管理**: Web 触发巡检、查看历史报告
    - **权限控制**: 基于 RBAC 的用户权限管理

    ## 认证方式
    使用 JWT Bearer Token 认证，在请求头中添加：
    ```
    Authorization: Bearer <token>
    ```

    ## 错误码说明
    | 错误码 | 说明 |
    |--------|------|
    | 0 | 成功 |
    | 1001 | 请求参数错误 |
    | 1002 | 数据验证失败 |
    | 2001 | 未认证 |
    | 2002 | Token 过期 |
    | 2003 | Token 无效 |
    | 3001 | 权限不足 |
    | 4001 | 资源不存在 |
    | 5001 | 服务器内部错误 |
    | 5002 | 数据库错误 |
    | 5003 | 外部服务调用失败 |
  version: 1.0.0
  contact:
    name: CMDB Platform Team
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: 开发环境
  - url: https://cmdb.example.com
    description: 生产环境

tags:
  - name: auth
    description: 用户认证（登录/登出/刷新Token）
  - name: users
    description: 用户管理
  - name: roles
    description: 角色管理
  - name: projects
    description: 项目管理
  - name: applications
    description: 应用管理
  - name: hosts
    description: 主机资产管理
  - name: mysql-instances
    description: MySQL 实例管理
  - name: redis-instances
    description: Redis 实例管理
  - name: nginx-instances
    description: Nginx 实例管理
  - name: tomcat-instances
    description: Tomcat 实例管理
  - name: elasticsearch-clusters
    description: Elasticsearch 集群管理
  - name: monitor
    description: 监控数据透传（VictoriaMetrics）
  - name: alerts
    description: 告警数据透传（FlashDuty）
  - name: inspection
    description: 巡检管理
  - name: health
    description: 健康检查

paths:
  # 健康检查
  /health:
    get:
      tags:
        - health
      summary: 健康检查
      description: 检查服务是否正常运行
      operationId: healthCheck
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # 认证
  /api/v1/auth/login:
    post:
      tags:
        - auth
      summary: 用户登录
      description: 使用用户名和密码登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags:
        - auth
      summary: 用户登出
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      summary: 刷新 Token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'

  /api/v1/users:
    get:
      tags:
        - users
      summary: 获取用户列表
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                      total:
                        type: integer
    post:
      tags:
        - users
      summary: 创建用户
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: 创建成功

  /api/v1/users/{id}:
    get:
      tags:
        - users
      summary: 获取用户详情
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - users
      summary: 更新用户
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: 更新成功
    delete:
      tags:
        - users
      summary: 删除用户
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  /api/v1/roles:
