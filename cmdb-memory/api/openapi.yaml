components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token 认证

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未认证或 Token 无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # 通用响应
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功
          example: 0
        message:
          type: string
          description: 响应消息
          example: success
        data:
          type: object
          description: 响应数据

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: 错误码
          example: 1001
        message:
          type: string
          description: 错误消息
          example: 请求参数错误
        details:
          type: string
          description: 错误详情

    # 分页
    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: 当前页码
          example: 1
        page_size:
          type: integer
          description: 每页数量
          example: 20
        total:
          type: integer
          description: 总记录数
          example: 100

    # 认证相关
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: 用户名
          example: admin
        password:
          type: string
          format: password
          description: 密码
          example: '********'

    LoginResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object
          properties:
            access_token:
              type: string
              description: 访问令牌
            refresh_token:
              type: string
              description: 刷新令牌
            expires_in:
              type: integer
              description: 过期时间（秒）
              example: 86400
            user:
              $ref: '#/components/schemas/User'

    TokenRefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: 刷新令牌

    TokenRefreshResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object
          properties:
            access_token:
              type: string
            expires_in:
              type: integer
              example: 86400

    # 用户相关
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 用户ID
        username:
          type: string
          description: 用户名
        email:
          type: string
          format: email
          description: 邮箱
        display_name:
          type: string
          description: 显示名称
        status:
          type: string
          enum: [active, inactive]
          description: 状态
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserCreate:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          format: password
          minLength: 8
        email:
          type: string
          format: email
        display_name:
          type: string
        role_ids:
          type: array
          items:
            type: integer

    UserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
        status:
          type: string
          enum: [active, inactive]
        role_ids:
          type: array
          items:
            type: integer

    # 角色相关
    Role:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 角色名称
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        created_at:
          type: string
          format: date-time

    RoleCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        permission_ids:
          type: array
          items:
            type: integer

    Permission:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        resource:
          type: string
        action:
          type: string
        description:
          type: string

    # 项目相关
    Project:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        code:
          type: string
        description:
          type: string
        owner:
          type: string
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectCreate:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
        code:
          type: string
        description:
          type: string
        owner:
          type: string

    # 应用相关
    Application:
      type: object
      properties:
        id:
          type: integer
          format: int64
        project_id:
          type: integer
          format: int64
        name:
          type: string
        code:
          type: string
        description:
          type: string
        owner:
          type: string
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApplicationCreate:
      type: object
      required:
        - name
        - code
        - project_id
      properties:
        project_id:
          type: integer
        name:
          type: string
        code:
          type: string
        description:
          type: string
        owner:
          type: string

    # 主机资产
    Host:
      type: object
      properties:
        id:
          type: integer
          format: int64
        ident:
          type: string
          description: 主机标识符
        hostname:
          type: string
        ip:
          type: string
          format: ipv4
        os:
          type: string
        os_version:
          type: string
        kernel_version:
          type: string
        cpu_cores:
          type: integer
        cpu_model:
          type: string
        memory_total:
          type: integer
          format: int64
        status:
          type: string
          enum: [online, offline]
        business_group:
          type: string
        env:
          type: string
        application_id:
          type: integer
        tags:
          type: object
          additionalProperties:
            type: string
        last_sync_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    # MySQL 实例
    MySQLInstance:
      type: object
      properties:
        id:
          type: integer
          format: int64
        address:
          type: string
          description: 实例地址 (IP:Port)
        ip:
          type: string
        port:
          type: integer
        version:
          type: string
        cluster_mode:
          type: string
          enum: [mgr, dual-master, master-slave]
        server_id:
          type: string
        host_id:
          type: integer
        application_id:
          type: integer
        status:
          type: string
          enum: [online, offline]
        last_sync_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    # Redis 实例
    RedisInstance:
      type: object
      properties:
        id:
          type: integer
          format: int64
        address:
          type: string
        ip:
          type: string
        port:
          type: integer
        version:
          type: string
        cluster_mode:
          type: string
        role:
          type: string
          enum: [master, slave]
        host_id:
          type: integer
        application_id:
          type: integer
        status:
          type: string
          enum: [online, offline]
        last_sync_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    # Nginx 实例
    NginxInstance:
      type: object
      properties:
        id:
          type: integer
          format: int64
        address:
          type: string
        ip:
          type: string
        port:
          type: integer
        version:
          type: string
        host_id:
          type: integer
        application_id:
          type: integer
        status:
          type: string
          enum: [online, offline]
        last_sync_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    # Tomcat 实例
    TomcatInstance:
      type: object
      properties:
        id:
          type: integer
          format: int64
        address:
          type: string
        ip:
          type: string
        port:
          type: integer
        version:
          type: string
        jvm_version:
          type: string
        host_id:
          type: integer
        application_id:
          type: integer
        status:
          type: string
          enum: [online, offline]
        last_sync_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    # Elasticsearch 集群
    ElasticsearchCluster:
      type: object
      properties:
        id:
          type: integer
          format: int64
        cluster_name:
          type: string
        version:
          type: string
        node_count:
          type: integer
        status:
          type: string
          enum: [green, yellow, red]
        application_id:
          type: integer
        last_sync_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    # 监控相关
    MetricsQuery:
      type: object
      properties:
        query:
          type: string
          description: PromQL 查询表达式
        time:
          type: string
          format: date-time
          description: 查询时间点

    MetricsRangeQuery:
      type: object
      properties:
        query:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        step:
          type: string
          description: 步长，如 5m

    # 告警相关
    Alert:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [critical, warning, info]
        status:
          type: string
          enum: [firing, resolved]
        source:
          type: string
        created_at:
          type: string
          format: date-time

    Incident:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
        severity:
          type: string
        created_at:
          type: string
          format: date-time

    # 巡检相关
    InspectionJob:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [host, mysql, redis, nginx, tomcat, elasticsearch, all]
        trigger_type:
          type: string
          enum: [manual, api, cron]
        status:
          type: string
          enum: [pending, running, completed, failed]
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        duration_seconds:
          type: integer
        report_excel_path:
          type: string
        report_html_path:
          type: string
        summary:
          type: object
        error_message:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time

    InspectionJobCreate:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [host, mysql, redis, nginx, tomcat, elasticsearch, all]
